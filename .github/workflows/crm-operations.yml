name: CRM operations verification
on:
  pull_request:
  push:
    branches: [feat/omnichat-operations-20261109]
permissions:
  contents: read
concurrency:
  group: crm-operations-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:operations
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run verify:production-boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-operations-evidence
          path: test-results/
          retention-days: 7

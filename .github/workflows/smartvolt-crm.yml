name: SmartVolt independent CRM
on:
  pull_request:
    paths: ['apps/smartvolt-crm/**', '.github/workflows/smartvolt-crm.yml']
  push:
    branches: ['feat/smartvolt-standalone-saas-20261111']
    paths: ['apps/smartvolt-crm/**', '.github/workflows/smartvolt-crm.yml']
permissions:
  contents: read
concurrency:
  group: smartvolt-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/smartvolt-crm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/smartvolt-crm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify public website scan without company writes
        run: node --import tsx scripts/verify-public-website.ts https://convelta.io
      - run: npm run build
      - name: Select and record acceptance browser
        run: bash ../../scripts/select-ci-browser.sh
      - name: Verify production cold load and refresh
        run: npm run test:paint
      - name: Verify conversation operations interactions
        run: npm run test:e2e -- e2e/operations.spec.ts
      - name: Verify website knowledge import interactions
        run: npm run test:e2e -- e2e/website.spec.ts
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smartvolt-browser-evidence
          path: |
            apps/smartvolt-crm/test-results/
            apps/smartvolt-crm/paint-test-results/
          retention-days: 7

  postgres-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/smartvolt-crm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: convelta_operations
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convelta_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/smartvolt-crm/package-lock.json
      - run: npm ci
      - name: Verify real PostgreSQL concurrent assignment
        run: node --import tsx scripts/verify-operations-postgres.ts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: convelta_operations
          PGUSER: postgres
          PGPASSWORD: isolated-ci-password
